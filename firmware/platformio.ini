; ============================================================
; Datei:   platformio.ini
; Projekt: Briefkastensensor (C++ Portierung von MicroPython)
; Autor:   Jonas Thern
; Hinweis: Kommentare und Formatierung wurden mit Unterstuetzung
;          von kuenstlicher Intelligenz (Claude, Anthropic) erstellt.
; ============================================================

[platformio]
default_envs = sender

[env]
platform = espressif32@6.7.0
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11

; ------------------------------------------------------------
; Sender im Briefkasten (Heltec Wireless Stick Lite V3, ESP32-S3)
; ------------------------------------------------------------
[env:sender]
; Hinweis: Fuer den Wireless Stick Lite V3 existiert keine eigene
; Board-Definition. Der WiFi LoRa 32 V3 ist elektrisch identisch
; (ESP32-S3FN8, 8 MB Flash, gleiche SX1262-Pinbelegung), nur ohne OLED.
board = heltec_wifi_lora_32_V3
build_src_filter = +<common/> +<sender/>
lib_deps =
    jgromes/RadioLib@^6.6.0
    pololu/VL53L0X@^1.3.1

; ------------------------------------------------------------
; Gateway (Heltec WiFi LoRa 32 V3, ESP32-S3)
; ------------------------------------------------------------
[env:gateway]
board = heltec_wifi_lora_32_V3
build_src_filter = +<common/> +<gateway/>
lib_deps =
    jgromes/RadioLib@^6.6.0
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14

; ------------------------------------------------------------
; Provisionierung: schreibt Zugangsdaten aus der .env Datei in den NVS
; Einmalig auf den jeweiligen Chip flashen, danach die eigentliche
; Firmware (sender oder gateway) aufspielen
; ------------------------------------------------------------
[env:provision]
board = heltec_wifi_lora_32_V3
build_src_filter = +<provision/>
extra_scripts = pre:scripts/load_env.py
